name: Android Build

# Builds a debug APK (phone + Android TV in one APK).
# Also called by upstream-sync.yml to check a merge before it lands on master.

on:
  push:
    branches: [master, "claude/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string

concurrency:
  group: android-build-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  # Same helper projects and pins as upstream's spotube-release-binary.yml
  COMPOSE_WEBVIEW_REPO: kdroidFilter/ComposeNativeWebview
  COMPOSE_WEBVIEW_COMMIT: 5aeb268a2c37ff4dbfb76924573344a7c4f763ce
  GRADLE_PLUGIN_REPO: team-spotube/gradle-plugin
  VLCJ_BUNDLER_REPO: team-spotube/vlcj-bundler-gradle-plugin

jobs:
  prepare-deps:
    name: Prepare dependencies
    runs-on: macos-latest
    steps:
      - name: Checkout (for the versions catalog)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: gradle/libs.versions.toml
          sparse-checkout-cone-mode: false

      - name: Restore maven local
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-local-v1-${{ env.COMPOSE_WEBVIEW_COMMIT }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Checkout ComposeNativeWebview
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.COMPOSE_WEBVIEW_REPO }}
          ref: ${{ env.COMPOSE_WEBVIEW_COMMIT }}
          path: compose-webview

      - name: Checkout gradle-plugin
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GRADLE_PLUGIN_REPO }}
          path: gradle-plugin

      - name: Checkout vlcj-bundler
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.VLCJ_BUNDLER_REPO }}
          path: vlcj-bundler

      - name: Set up JDK 21
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        if: steps.cache.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3
        with:
          # the action's default also asks for the removed "tools" package
          packages: platform-tools

      - name: Set up Rust
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        if: steps.cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Publish helpers to maven local
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for dir in compose-webview gradle-plugin vlcj-bundler; do
            (cd "$dir" && chmod +x gradlew && ./gradlew publishToMavenLocal)
          done

      - name: Upload maven local
        uses: actions/upload-artifact@v4
        with:
          name: maven-local
          path: ~/.m2/repository/
          retention-days: 1

  build-android:
    name: Android APK
    needs: prepare-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Download maven local
        uses: actions/download-artifact@v4
        with:
          name: maven-local
          path: ~/.m2/repository/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beatviz-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 14
