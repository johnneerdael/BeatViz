name: Upstream Sync

# Merges upstream Spotube (KRTirtho/spotube, branch dev) into master whenever
# the merge is clean AND the Android build still passes.
#   - Clean merge + green build  -> master is fast-forwarded to the merge.
#   - Merge conflict             -> an issue lists the conflicting files.
#   - Clean merge + red build    -> the merge is left on the `upstream-sync`
#                                   branch and an issue links the failed run.

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Upstream branch to merge
        required: false
        default: dev

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/KRTirtho/spotube
  UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'dev' }}
  SYNC_BRANCH: upstream-sync

jobs:
  merge:
    name: Merge upstream
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.merge.outputs.status }}
      sha: ${{ steps.merge.outputs.sha }}
      base: ${{ steps.merge.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream into master
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream/$UPSTREAM_BRANCH"
            echo "status=up-to-date" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit "upstream/$UPSTREAM_BRANCH" \
               -m "Merge upstream Spotube $UPSTREAM_BRANCH ($(git rev-parse --short upstream/$UPSTREAM_BRANCH))"; then
            git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "status=merged" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflicts=$(git diff --name-only --diff-filter=U)
          git merge --abort
          echo "status=conflict" >> "$GITHUB_OUTPUT"

          body=$(printf '%s\n' \
            "Merging \`upstream/$UPSTREAM_BRANCH\` ($(git rev-parse --short upstream/$UPSTREAM_BRANCH)) into \`master\` conflicts in:" \
            "" \
            "$(echo "$conflicts" | sed 's/^/- `/; s/$/`/')" \
            "" \
            "Resolve locally: \`git fetch $UPSTREAM_REPO $UPSTREAM_BRANCH && git merge FETCH_HEAD\`, then push to master." \
            "" \
            "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          gh label create upstream-sync --color FBCA04 --force >/dev/null
          existing=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label upstream-sync --title "Upstream sync needs a manual merge" --body "$body"
          fi

  build:
    name: Build merged tree
    needs: merge
    if: needs.merge.outputs.status == 'merged'
    uses: ./.github/workflows/android-build.yml
    with:
      ref: ${{ needs.merge.outputs.sha }}

  promote:
    name: Fast-forward master
    needs: [merge, build]
    if: needs.merge.outputs.status == 'merged' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.merge.outputs.sha }}
          fetch-depth: 0

      - name: Push merge to master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Plain push = fast-forward only. If master moved during the build,
          # this fails and tomorrow's run merges again.
          git push origin "${{ needs.merge.outputs.sha }}:refs/heads/master"
          git push origin --delete "$SYNC_BRANCH" || true
          existing=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Upstream merged cleanly and the build passed: ${{ needs.merge.outputs.sha }}"
          fi

  report-build-failure:
    name: Report failed build
    needs: [merge, build]
    if: always() && needs.merge.outputs.status == 'merged' && needs.build.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          body=$(printf '%s\n' \
            "Upstream \`$UPSTREAM_BRANCH\` merges cleanly, but the Android build fails, so \`master\` was not updated." \
            "" \
            "The merge is on branch \`$SYNC_BRANCH\` (${{ needs.merge.outputs.sha }}). Fix it there, then fast-forward master." \
            "" \
            "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          gh label create upstream-sync --color FBCA04 --force >/dev/null
          existing=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label upstream-sync --title "Upstream sync: merged code does not build" --body "$body"
          fi
