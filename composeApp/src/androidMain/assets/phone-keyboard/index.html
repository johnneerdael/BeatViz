<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>BeatViz phone keyboard</title>
  <style>
    :root { color-scheme: dark; --bg: #020202; --fg: #f2f2f2; --muted: #9a9aa2; --surface: #1a1a1a; --accent: #1ed760; --on-accent: #000000; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 16px; font: 16px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 480px; margin: 0 auto; display: grid; gap: 16px; }
    h1 { font-size: 20px; margin: 0; }
    p { margin: 0; color: var(--muted); }
    #label { font-weight: 600; color: var(--fg); font-size: 18px; }
    input[type=text], input[type=password] { width: 100%; font-size: 18px; padding: 14px; border-radius: 12px; border: 1px solid var(--muted); background: var(--surface); color: var(--fg); }
    input:focus { outline: 2px solid var(--accent); }
    button { font-size: 16px; padding: 14px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600; width: 100%; }
    label.toggle { display: flex; gap: 8px; align-items: center; color: var(--muted); }
    .field { display: none; gap: 12px; }
    body.active .field { display: grid; }
  </style>
</head>
<body>
  <main>
    <h1>BeatViz phone keyboard</h1>
    <p id="status">Connecting…</p>
    <div class="field">
      <span id="label"></span>
      <input id="text" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Text for the TV">
      <label class="toggle" id="showRow" hidden><input id="show" type="checkbox"> Show text</label>
      <button id="enter">Enter</button>
    </div>
  </main>
  <script src="/noble-ciphers.js"></script>
  <script src="/app.js"></script>
</body>
</html>
